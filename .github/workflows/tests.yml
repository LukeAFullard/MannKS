# Run the test suite on pull requests and on pushes to main.
#
# The matrix covers both ends of the supported dependency range:
#   * "minimum"  - the lowest versions pyproject.toml allows, on the oldest
#                  supported Python. `uv --resolution lowest-direct` reads the
#                  bounds from pyproject.toml, so this job follows them
#                  automatically and fails if a declared minimum stops working.
#   * "scipy-1.14" - a mid-range pin. SciPy 1.13-1.15 use a different
#                  `rankdata` implementation from older and newer releases,
#                  which has exposed test problems before.
#   * "latest"   - whatever pip resolves today, on Linux, Windows and macOS.
#
# Tests that need R/rpy2 skip themselves when R is not installed.

name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.deps }} / py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  python: "3.9",  deps: minimum }
          - { os: ubuntu-latest,  python: "3.13", deps: scipy-1.14 }
          - { os: ubuntu-latest,  python: "3.9",  deps: latest }
          - { os: ubuntu-latest,  python: "3.13", deps: latest }
          - { os: windows-latest, python: "3.13", deps: latest }
          - { os: macos-latest,   python: "3.13", deps: latest }
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install (minimum supported versions)
        if: matrix.deps == 'minimum'
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system --resolution lowest-direct .
          uv pip install --system pytest

      - name: Install (SciPy 1.14 era pins)
        if: matrix.deps == 'scipy-1.14'
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest "numpy==2.1.3" "pandas==2.2.3" "scipy==1.14.1"

      - name: Install (latest versions)
        if: matrix.deps == 'latest'
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest

      - name: Show installed versions
        run: python -m pip list

      - name: Run tests
        run: python -m pytest -q
