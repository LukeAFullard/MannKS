# Publish MannKS to PyPI using Trusted Publishing (OIDC).
#
# No API token is stored on GitHub: PyPI trusts this repository/workflow/
# environment combination (configured at pypi.org -> mannks -> Publishing)
# and issues a short-lived upload credential for each run.
#
# Triggers:
#   * automatically when a GitHub release is published;
#   * manually from the Actions tab ("Run workflow").
#
# The `publish` job uses the `pypi` environment. Configure that environment
# with a required reviewer (Settings -> Environments -> pypi) so every upload
# waits for manual approval.

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check release tag matches package version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['tool']['poetry']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          echo "pyproject version: $version, release tag: $GITHUB_REF_NAME"
          if [ "$version" != "$tag" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
            exit 1
          fi

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest build twine

      - name: Run tests
        run: python -m pytest -q

      - name: Build wheel and sdist
        run: |
          rm -rf dist
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mannks/
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
