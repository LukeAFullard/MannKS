[tool.poetry]
name = "mannks"
version = "0.7.1"
description = "Non-parametric trend analysis for unequally spaced time series with censored data and large dataset support"
authors = ["Luke Fullard"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/LukeAFullard/MannKS"
repository = "https://github.com/LukeAFullard/MannKS"
documentation = "https://github.com/LukeAFullard/MannKS/tree/main/Examples"
keywords = [
    "mann-kendall",
    "sen-slope",
    "trend-analysis",
    "censored-data",
    "time-series",
    "segmented-regression",
    "piecewise-regression",
    "breakpoint-detection",
    "rolling-trend",
    "bootstrap",
    "quantile-kendall",
    "quantile-trend",
    "egret",
    "streamflow"
]

packages = [{ include = "MannKS" }]

[tool.poetry.dependencies]
python = ">=3.9"
numpy = ">=1.23"
pandas = ">=2.2"
scipy = ">=1.10"
matplotlib = ">=3.6.0"
seaborn = ">=0.13.0"
piecewise-regression = "^1.5.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=6.0"
pytest-cov = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
